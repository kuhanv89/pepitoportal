name: Add Pet Outlet prices

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/pet-outlet-pricing.yml

permissions:
  contents: write

jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply pricing to storefront
        run: |
          python - <<'PY'
          import re, json
          from pathlib import Path

          path = Path('pet-outlet/index.html')
          s = path.read_text(encoding='utf-8')

          prices = {int(k):v for k,v in json.loads(r'''{"1":1.29,"2":1.29,"3":1.29,"4":0.99,"5":0.99,"6":0.99,"7":0.99,"8":0.99,"9":0.99,"10":0.99,"11":1.29,"12":1.29,"13":0.89,"14":0.89,"15":0.99,"16":0.99,"17":0.89,"18":0.99,"19":0.99,"20":2.49,"21":0.89,"22":1.29,"23":0.89,"24":1.29,"25":2.29,"26":0.79,"27":1.29,"28":0.89,"29":1.29,"30":1.29,"31":1.49,"32":1.29,"33":1.49,"34":1.29,"35":1.29,"36":1.29,"37":3.99,"38":3.69,"39":1.79,"40":1.39,"41":1.69,"42":1.69,"43":1.69,"44":1.79,"45":1.89,"46":2.29,"47":4.99,"48":9.99,"49":12.99,"50":2.19}''').items()}
          bundles = {int(k):v for k,v in json.loads(r'''{"1":"Any 6 Delectables · $6.99","2":"Any 6 Delectables · $6.99","3":"Any 6 Delectables · $6.99","4":"Any 12 Fancy Feast · $11.49","5":"Any 12 Fancy Feast · $11.49","6":"Any 12 Fancy Feast · $11.49","7":"Any 12 Fancy Feast · $11.49","8":"Any 12 Fancy Feast · $11.49","10":"Any 12 Fancy Feast · $11.49","11":"Any 6 Delectables · $6.99","12":"Any 6 Delectables · $6.99","13":"Any 12 Friskies · $9.99","14":"Any 12 Friskies · $9.99","15":"Any 12 Fancy Feast · $11.49","16":"Any 12 Fancy Feast · $11.49","17":"Any 12 Friskies · $9.99","18":"Any 12 Fancy Feast · $11.49","19":"Any 12 Fancy Feast · $11.49","21":"Any 12 Friskies · $9.99","22":"Any 6 Delectables · $6.99","23":"Any 12 Friskies · $9.99","24":"Any 6 Sheba · $6.99","27":"Any 6 Delectables · $6.99","28":"Any 12 Friskies · $9.99","29":"Any 6 Sheba · $6.99","30":"Any 6 Delectables · $6.99","32":"Any 6 Sheba · $6.99","34":"Any 6 Gravy Indulgence · $7.29","35":"Any 6 Gravy Indulgence · $7.29","36":"Any 6 Gravy Indulgence · $7.29"}''').items()}

          if '.pricebar{' not in s:
              css = '''
.pricebar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:10px 0 14px}
.pricebar strong{font-size:27px;line-height:1;font-weight:1000;letter-spacing:-.04em;color:var(--ink)}
.pricebar span{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.deal-note{display:inline-block;margin:-4px 0 13px;background:var(--sun);color:var(--ink);padding:6px 9px;border-radius:999px;font-size:10px;font-weight:950;letter-spacing:.03em}
.feature-price{margin-top:10px;font-size:26px;font-weight:1000;letter-spacing:-.04em}
.feature-deal{margin-top:5px;font-size:11px;font-weight:900;color:var(--teal)}
.stockprice{display:block!important;font-size:19px!important;margin-top:5px;color:var(--ink)}
.stocktile small{display:block;margin-top:2px;font-weight:900}
.detail-price{font-size:45px;font-weight:1000;letter-spacing:-.05em;line-height:1;margin:6px 0 9px}
.detail-price-note{font-size:12px;font-weight:900;color:var(--teal);margin-bottom:15px}
.pricing-strip{background:var(--sun);border-radius:22px;padding:18px 22px;margin:0 auto 34px;display:flex;align-items:center;justify-content:space-between;gap:20px;font-weight:850}
.pricing-strip b{font-size:21px;letter-spacing:-.02em}
@media(max-width:650px){.pricebar strong{font-size:23px}.pricing-strip{display:block}.pricing-strip span{display:block;margin-top:5px}.detail-price{font-size:38px}}
'''
              s = s.replace('</style>', css + '</style>')

          s = re.sub(
              r'<div class="offer">.*?</div>',
              '<div class="offer">PET OUTLET · PRICES FROM $0.79 · STOCK-UP MULTI-BUYS · LIMITED QUANTITIES</div>',
              s, count=1
          )
          marker = '<section class="wrap trust">'
          if '<div class="wrap pricing-strip">' not in s:
              strip = '<div class="wrap pricing-strip"><b>Everyday staples priced tight. Bigger savings on stock-up buys.</b><span>Mix eligible flavors within the same brand deal while stock lasts.</span></div>'
              s = s.replace(marker, strip + marker, 1)

          card_re = re.compile(r'(<article class="product-card"[^>]*>.*?<a class="card-link" href="#product-(\d+)".*?<h3>.*?</h3>)(<div class="card-bottom">)', re.S)
          def card_cb(m):
              r = int(m.group(2))
              x = '<div class="pricebar"><strong>$' + format(prices[r], '.2f') + '</strong><span>Outlet price</span></div>'
              if r in bundles:
                  x += '<div class="deal-note">' + bundles[r] + '</div>'
              return m.group(1) + x + m.group(3)
          s, card_count = card_re.subn(card_cb, s)

          feat_re = re.compile(r'(<article class="feature"><a href="#product-(\d+)".*?<div class="feature-meta">.*?</div>)(<span class="view">)', re.S)
          def feat_cb(m):
              r=int(m.group(2))
              x='<div class="feature-price">$' + format(prices[r], '.2f') + '</div>'
              if r in bundles:
                  x+='<div class="feature-deal">' + bundles[r] + '</div>'
              return m.group(1)+x+m.group(3)
          s, feat_count = feat_re.subn(feat_cb, s)

          stock_re = re.compile(r'(<a class="stocktile" href="#product-(\d+)".*?<strong>\d+</strong> <span>units</span>)(</div></a>)', re.S)
          def stock_cb(m):
              r=int(m.group(2))
              x='<strong class="stockprice">$' + format(prices[r], '.2f') + '</strong>'
              if r in bundles:
                  x+='<small>' + bundles[r] + '</small>'
              return m.group(1)+x+m.group(3)
          s, stock_count = stock_re.subn(stock_cb, s)

          detail_re = re.compile(r'(<section class="product-detail" id="product-(\d+)".*?<div class="detail-copy">.*?<h2>.*?</h2>)', re.S)
          def detail_cb(m):
              r=int(m.group(2))
              note=bundles.get(r,'Outlet price · limited stock')
              x='<div class="detail-price">$' + format(prices[r], '.2f') + '</div><div class="detail-price-note">' + note + '</div>'
              return m.group(1)+x
          s, detail_count = detail_re.subn(detail_cb, s)

          path.write_text(s, encoding='utf-8')
          Path('pet-outlet/pricing-report.txt').write_text(
              'Cards priced: %s/50\nFeatured cards priced: %s\nStock-up tiles priced: %s\nDetail pages priced: %s/50\n' %
              (card_count, feat_count, stock_count, detail_count),
              encoding='utf-8'
          )
          if card_count != 50 or detail_count != 50:
              raise SystemExit('Pricing insertion incomplete: cards=%s details=%s' % (card_count, detail_count))
          PY
      - name: Commit pricing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pet-outlet/index.html pet-outlet/pricing-report.txt
          git commit -m "Add outlet prices to all 50 products"
          git push
